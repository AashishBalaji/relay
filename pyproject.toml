[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "A manifest-driven connector framework with AI-assisted connector generation and automated drift detection"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "click>=8.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
relay = "relay.cli.main:cli"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "live: real network call against a third-party API (not mocked)",
]
